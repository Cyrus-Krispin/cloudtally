name: Bug report
description: Something doesn't work, or a cost looks wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: input
    id: link
    attributes:
      label: Share link
      description: Use ⋯ → Copy share link so we can open your exact design.
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: Chrome 140 on macOS
